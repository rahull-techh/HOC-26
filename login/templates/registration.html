{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Student Registration</h2>

    <form method="POST">
        {% csrf_token %}

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" maxlength="50" required>

        <label for="number">Phone Number</label>
        <input type="tel" id="number" name="number"
               placeholder="e.g. +919999999999" required>

        <label for="st_id">Student ID</label>
        <input type="text" id="st_id" name="st_id"
               minlength="6" maxlength="7"
               pattern="[0-9]{6,7}" required
               placeholder="Enter your College student number" required>
               
               {% if error %}
               <p class="error-message">{{ error1 }}</p>
            {% endif %}

        <label for="uni_id">University ID</label>
        <input type="text" id="uni_id" name="uni_id"
               minlength="13" maxlength="13"
               pattern="[0-9]{13}" required
               placeholder="Enter 13 digits University roll number" required>
               {% if error %}
               <p class="error-message">{{ error2 }}</p>
               {% endif %}

        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
            <option value="">Select Gender</option>
            <option value="M">Male</option>
            <option value="F">Female</option>
            <option value="O">Others</option>
            <option value="N">Prefer not to say</option>
        </select>

        <label for="year">Year</label>
        <select id="year" name="year" required>
            <option value="">Select Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
        </select>

        <label for="branch">Branch</label>
        <select id="branch" name="branch" required>
            <option value="">Select Branch</option>
            <option value="CSE">CSE</option>
            <option value="AIML">CSE (AI & ML)</option>
            <option value="DS">CSE (Data Science)</option>
            <option value="CS">Computer Science</option>
            <option value="IT">Information Technology</option>
            <option value="CSIT">CS-IT</option>
            <option value="ECE">ECE</option>
            <option value="EN">Electronics & Instrumentation</option>
            <option value="OTH">Others</option>
        </select>

        <label for="residence">Residence</label>
        <select id="residence" name="residence" required>
            <option value="">Select Residence</option>
            <option value="D">Day Scholar</option>
            <option value="H">Hosteller</option>
        </select>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" maxlength="254" required>
        {% if error %}
        <p class="error-message">{{ error3 }}</p>
        {% endif %}
        

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
        minlength="8" required
        placeholder="e.g. password@123" required>
        {% if error %}
        <p class="error-message">{{ error4 }}</p>
        {% endif %}

        <button type="submit">Register</button>
    </form>
</div>
{% endblock content %}
