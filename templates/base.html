
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hour of Code | Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            padding: 40px 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #eaf0ff;
            background:
                radial-gradient(circle at 10% 10%, #263c72 0, transparent 35%),
                radial-gradient(circle at 90% 90%, #4b2675 0, transparent 35%),
                #0b1020;
            overflow-x: hidden;
        }

        /* Background decoration */
        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 230px;
            height: 230px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
            z-index: -1;
            animation: float 7s ease-in-out infinite alternate;
        }

        body::before {
            background: #2878ff;
            top: 5%;
            left: 5%;
        }

        body::after {
            background: #a855f7;
            bottom: 5%;
            right: 5%;
            animation-delay: 2s;
        }

        @keyframes float {
            from {
                transform: translateY(0) scale(1);
            }
            to {
                transform: translateY(-35px) scale(1.15);
            }
        }

        /* Main registration card */
        .container {
            width: 100%;
            max-width: 580px;
            margin: auto;
            padding: 35px;
            background: rgba(19, 27, 49, 0.88);
            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 22px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(15px);
            animation: appear 0.7s ease-out;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Heading */
        h2 {
            color: #ffffff;
            font-size: 30px;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        h2::before {
            content: "</>";
            display: block;
            width: fit-content;
            margin: 0 auto 14px;
            padding: 10px 17px;
            color: #7dd3fc;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(125, 211, 252, 0.35);
            border-radius: 12px;
            font-size: 23px;
            font-weight: bold;
        }

        /* Optional subtitle */
        .subtitle {
            color: #aab7d0;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Labels */
        label {
            display: block;
            margin-top: 17px;
            margin-bottom: 7px;
            color: #dbe5fa;
            font-size: 13px;
            font-weight: 600;
        }

        /* Inputs and dropdowns */
        input,
        select {
            display: block;
            width: 100%;
            padding: 13px 14px;
            background-color: #111a2e;
            color: #f1f5f9;
            border: 1px solid #35435f;
            border-radius: 10px;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.25s ease,
                        box-shadow 0.25s ease,
                        background-color 0.25s ease;
        }

        input::placeholder {
            color: #7786a2;
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #111a2e;
            color: white;
        }

        input:hover,
        select:hover {
            border-color: #647da8;
        }

        input:focus,
        select:focus {
            border-color: #38bdf8;
            background-color: #15213a;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        /* Error messages from Django */
        .error-message {
            color: #fecaca;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(248, 113, 113, 0.6);
            border-radius: 9px;
            padding: 12px 14px;
            margin: 10px 0;
            font-size: 13px;
            line-height: 1.5;
            animation: appear 0.3s ease-out;
        }

        /* Submit button */
        button {
            width: 100%;
            padding: 14px;
            margin-top: 27px;
            border: none;
            border-radius: 10px;
            color: #071225;
            background: linear-gradient(110deg, #38bdf8, #818cf8);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: transform 0.25s ease,
                        box-shadow 0.25s ease,
                        filter 0.25s ease;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.25);
            filter: brightness(1.1);
        }

        button:active {
            transform: translateY(0);
        }

        /* Footer */
        .footer-text {
            color: #8291ad;
            text-align: center;
            font-size: 12px;
            line-height: 1.6;
            margin-top: 23px;
        }

        .footer-text span {
            color: #7dd3fc;
            font-weight: 600;
        }

        /* Mobile layout */
        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            .container {
                padding: 25px 19px;
                border-radius: 17px;
            }

            h2 {
                font-size: 25px;
            }

            input,
            select {
                padding: 12px;
            }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    {% block content %}
    {% endblock content %}
</body>
</html>
