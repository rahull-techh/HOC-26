{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hour of code Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #9b95ae;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: lightblue;
            border: 1px solid #3d2fa6;

            padding: 20px;
        }

        h2 {
            background-color: #e39526;
            color: black;
            text-align: center;
            padding: 12px;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #a77a7a;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #088469;
        }
        .error-message {
        color: red;
        background-color: #ffe6e6;
        border: 1px solid red;
        padding: 10px;
        margin-bottom: 10px;
        font-size: 14px;
}
    </style>
</head>

<body>
{% block content %}

{% endblock content %}
</body>
</html>
